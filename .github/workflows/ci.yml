name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: campuswahala
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: campuswahala
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U campuswahala" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://campuswahala:ci-only-ephemeral-password@localhost:5432/campuswahala
      TEST_DATABASE_URL: postgresql://campuswahala:ci-only-ephemeral-password@localhost:5432/campuswahala
      CAPTURE_VISUALS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: az bicep build --file infra/main.bicep --outfile /tmp/campuswahala-arm.json
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:world-budgets
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase-2.5-visuals
          path: artifacts/*.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-measurements
          path: test-results/
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
  oss-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: mkdir -p artifacts
      - name: Complementary Semgrep Community scan
        run: >-
          docker run --rm --workdir /src
          --mount "type=bind,source=$PWD,target=/src,readonly"
          --mount "type=bind,source=$PWD/artifacts,target=/output"
          semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
          semgrep scan --config p/javascript --config p/nodejs --oss-only
          --metrics=off --disable-version-check --strict --error --jobs 2
          --exclude '**/node_modules/**' --exclude '**/.next/**' --exclude '**/dist/**'
          --json --output /output/semgrep.json apps packages scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-report
          path: artifacts/semgrep.json
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@6c05c4a00b91aa542267d8e32a8254774799d68d # v3.93.8
        with:
          extra_args: --only-verified
          version: 3.93.8
      - name: Verify secrets across complete repository history
        uses: trufflesecurity/trufflehog@6c05c4a00b91aa542267d8e32a8254774799d68d
        with:
          base: ""
          head: ${{ github.sha }}
          extra_args: --only-verified
          version: 3.93.8
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f Dockerfile.web -t campuswahala-web:ci .
      - run: docker build -f Dockerfile.api -t campuswahala-api:ci .
      - run: docker run --rm -v "$PWD/tests/web-container-smoke.mjs:/smoke.mjs:ro" --entrypoint node campuswahala-web:ci /smoke.mjs
      - run: docker run --rm -e APP_ENV=local -e PLAYER_STORE=memory -v "$PWD/tests/container-smoke.mjs:/smoke.mjs:ro" --entrypoint node campuswahala-api:ci /smoke.mjs
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: campuswahala-web:ci
          version: v0.75.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        if: always()
        with:
          image-ref: campuswahala-api:ci
          version: v0.75.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        if: always()
        with:
          image-ref: campuswahala-api:ci
          version: v0.75.0
          format: cyclonedx
          output: sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: api-sbom
          path: sbom.json
