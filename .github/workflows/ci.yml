name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: campuswahala
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: campuswahala
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U campuswahala" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://campuswahala:ci-only-ephemeral-password@localhost:5432/campuswahala
      TEST_DATABASE_URL: postgresql://campuswahala:ci-only-ephemeral-password@localhost:5432/campuswahala
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: az bicep build --file infra/main.bicep --outfile /tmp/campuswahala-arm.json
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.93.8
        with:
          extra_args: --only-verified
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.web -t campuswahala-web:ci .
      - run: docker build -f Dockerfile.api -t campuswahala-api:ci .
      - run: docker run --rm -e APP_ENV=local -e PLAYER_STORE=memory -v "$PWD/tests/container-smoke.mjs:/smoke.mjs:ro" --entrypoint node campuswahala-api:ci /smoke.mjs
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: campuswahala-web:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: campuswahala-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: campuswahala-api:ci
          format: cyclonedx
          output: sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: api-sbom
          path: sbom.json
